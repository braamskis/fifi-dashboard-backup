name: FiFi's Dashboard scan

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 5:30 PM ET in summer, 4:30 PM ET in winter, after the close
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild this many past trading days of scans for the scorecard (first run: 60)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: tqe-repo
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      - name: Test detectors, alerts, data layer, rotation and prime rules
        run: cd scanner && python test_patterns.py && python test_alerts.py && python test_massive.py && python test_rrg.py && python test_prime.py

      - name: Scan the market
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scanner/scan.py --backfill "${{ github.event.inputs.backfill || 0 }}"

      - name: Sector rotation (RRG)
        run: python scanner/rrg.py --out site/rrg.json || echo "RRG skipped"

      - name: Prime ideas, sector alignment and themes
        run: python scanner/prime.py --scan site/scan.json --rrg site/rrg.json || echo "Prime skipped"

      - name: Commit results (Netlify redeploys on push)
        run: |
          git config user.name "fifi-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/scan.json site/rrg.json site/charts site/history scanner/data
          git diff --cached --quiet && echo "Nothing new to commit" && exit 0
          git commit -m "scan: $(date -u +%F)"
          git pull --rebase
          git push
