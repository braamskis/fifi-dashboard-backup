name: FiFi's Dashboard alerts

on:
  schedule:
    - cron: "*/10 13-20 * * 1-5"   # every 10 minutes; the script only acts 9:35 AM - 4:00 PM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tqe-alerts
  cancel-in-progress: true

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      - name: Check pivots
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scanner/alerts.py

      - name: Save triggered list for the dashboard
        run: |
          git config user.name "fifi-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/alerts.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "alerts: $(date -u +%F\ %H:%M)"
          git pull --rebase
          git push
