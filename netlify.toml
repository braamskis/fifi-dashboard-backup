[build]
  publish = "site"
  command = ""

# The alert function reads the scan straight off disk instead of through the login gate
[functions]
  included_files = ["site/scan.json"]

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/charts/*"
  [headers.values]
    Cache-Control = "no-cache"
